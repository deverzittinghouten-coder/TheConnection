
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1518">
  <title>THE CONNECTION</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(35, 79, 73, 0.24), transparent 42%),
        radial-gradient(ellipse at 90% 80%, rgba(28, 54, 83, 0.25), transparent 45%),
        #0b1518;
      color: #e8efeb;
      font-family: "DM Sans", sans-serif;
    }

    .app {
      position: relative;
      max-width: 900px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 0 30px;
      background:
        linear-gradient(155deg, rgba(26, 48, 45, 0.96), rgba(16, 31, 36, 0.98) 55%, rgba(15, 29, 43, 0.98));
      border-left: 1px solid rgba(180, 210, 195, 0.05);
      border-right: 1px solid rgba(180, 210, 195, 0.05);
      box-shadow: 0 0 100px rgba(0, 0, 0, 0.25);
    }

    header {
      padding: 30px 0 24px;
      border-bottom: 1px solid rgba(190, 216, 202, 0.09);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
    }

    h1 {
      margin: 0;
      font-family: "Manrope", sans-serif;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 3.2px;
      color: #edf4ef;
    }

    .subtitle {
      margin-top: 6px;
      color: #91a99d;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #a1b8aa;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #83c19a;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(131, 193, 154, 0.65);
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 38px 5px;
      scrollbar-width: thin;
      scrollbar-color: #3b5a50 transparent;
    }

    .date-label {
      text-align: center;
      color: #829b90;
      font-size: 10px;
      letter-spacing: 2.5px;
      margin: 5px 0 42px;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 27px;
      max-width: 76%;
      animation: appear 0.35s ease;
    }

    .message.me {
      align-items: flex-end;
      margin-left: auto;
    }

    .name {
      color: #a4c6ad;
      font-size: 10px;
      font-weight: 600;
      margin: 0 0 8px 7px;
      letter-spacing: 0.8px;
    }

    .message.me .name {
      color: #a4b8b2;
      margin-right: 7px;
    }

    .bubble {
      padding: 14px 19px;
      background: linear-gradient(145deg, #263d38, #1d332f);
      border: 1px solid rgba(190, 220, 199, 0.09);
      border-radius: 4px 18px 18px 18px;
      color: #e2ece5;
      line-height: 1.7;
      font-size: 14px;
      overflow-wrap: anywhere;
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.13),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .message.me .bubble {
      background: linear-gradient(145deg, #345b50, #294b46);
      border-color: rgba(175, 218, 190, 0.13);
      border-radius: 18px 4px 18px 18px;
      color: #f0f6f1;
      box-shadow:
        0 9px 26px rgba(0, 0, 0, 0.19),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    #typing {
      min-height: 29px;
      color: #9bb5a5;
      font-size: 11px;
      letter-spacing: 0.4px;
      padding: 0 7px;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 7px;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;
      background: #a3d1ae;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    .composer {
      padding: 19px 0 25px;
      border-top: 1px solid rgba(190, 216, 202, 0.09);
    }

    form {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 7px 8px 7px 20px;
      background: linear-gradient(145deg, #1c302e, #182b2d);
      border: 1px solid rgba(151, 190, 166, 0.19);
      border-radius: 17px;
      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.22),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
      transition: border 0.25s, box-shadow 0.25s;
    }

    form:focus-within {
      border-color: rgba(139, 190, 153, 0.65);
      box-shadow:
        0 0 0 3px rgba(110, 161, 127, 0.08),
        0 12px 35px rgba(0, 0, 0, 0.22);
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #edf4ee;
      font: inherit;
      font-size: 14px;
      padding: 12px 0;
    }

    input::placeholder {
      color: #81968c;
    }

    button {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(190, 226, 198, 0.12);
      border-radius: 13px;
      background: linear-gradient(145deg, #5a8b6c, #38654f);
      color: #f3f8f2;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: linear-gradient(145deg, #6b9c7c, #47775d);
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
    }

    .footer-note {
      text-align: center;
      margin-top: 15px;
      color: #748b80;
      font-size: 9px;
      letter-spacing: 1.5px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      from {
        opacity: 0.3;
        transform: translateY(0);
      }
      to {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (max-width: 600px) {
      .app {
        padding: 0 17px;
      }

      header {
        padding: 23px 0 19px;
      }

      h1 {
        font-size: 16px;
        letter-spacing: 2.5px;
      }

      .message {
        max-width: 90%;
      }

      #chat {
        padding-top: 29px;
      }

      .status {
        font-size: 9px;
        letter-spacing: 1px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div>
          <h1>THE CONNECTION</h1>
          <div class="subtitle">A SPACE TO CONNECT</div>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        LIVE CHAT
      </div>
    </header>

    <main id="chat">
      <div class="date-label">THE CONVERSATION</div>
    </main>

    <div id="typing"></div>

    <div class="composer">
      <form id="messageForm">
        <input
          id="messageInput"
          type="text"
          placeholder="Schrijf iets..."
          autocomplete="off"
          required
        >
        <button id="sendButton" type="submit" aria-label="Verstuur">↑</button>
      </form>
      <div class="footer-note">EVERY CONVERSATION STARTS SOMEWHERE</div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");

    const participants = ["A", "B", "C", "D"];

    let history = [];
    let busy = false;
    let idleTimer = null;
    let typingTimer = null;
    let lastSpeaker = "";
    let conversationTurns = 0;

    function addMessage(text, isMe = false, speaker = "bezoeker") {
      const message = document.createElement("div");
      message.className = isMe ? "message me" : "message";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = "Persoon";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(name);
      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
      history.push({ text, speaker });

      if (history.length > 50) {
        history = history.slice(-50);
      }
    }

    function showTyping() {
      typing.innerHTML =
        'Een Persoon typt <span class="typing-dots"><span></span><span></span><span></span></span>';
    }

    function clearTimers() {
      clearTimeout(idleTimer);
      clearTimeout(typingTimer);
      idleTimer = null;
      typingTimer = null;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
    }

    function chooseParticipant() {
      const possible = participants.filter(person => person !== lastSpeaker);

      if (possible.length === 0) return "D";

      const choices = [...possible, "D", "D"];

      return choices[Math.floor(Math.random() * choices.length)];
    }

    async function pauseBeforeReply() {
      await wait(1500 + Math.random() * 2500);
      showTyping();
      await wait(3000 + Math.random() * 3000);
    }

    async function getReply(character) {
      showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            character,
            history
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || "De AI kon niet antwoorden.");
        }

        const data = await response.json();
        const reply = (data.reply || "").trim();

        if (!reply) {
          throw new Error("De AI gaf een leeg antwoord.");
        }

        addMessage(reply, false, character);
        lastSpeaker = character;
        typing.textContent = "";

        return true;

      } catch (error) {
        console.error("Chatfout:", error);
        typing.textContent = "Er ging iets mis met de verbinding.";
        return false;
      }
    }

    function scheduleNextConversation(delay) {
      clearTimers();

      if (conversationTurns <= 0) {
        typing.textContent = "";
        return;
      }

      const typingDelay = Math.max(
        1000,
        delay - (4000 + Math.random() * 4000)
      );

      typingTimer = setTimeout(() => {
        if (!busy) showTyping();
      }, typingDelay);

      idleTimer = setTimeout(async () => {
        if (busy) {
          scheduleNextConversation(5000 + Math.random() * 5000);
          return;
        }

        setBusy(true);

        const nextPerson = chooseParticipant();
        const success = await getReply(nextPerson);

        setBusy(false);

        if (!success) {
          typing.textContent = "";
          return;
        }

        conversationTurns--;

        if (conversationTurns > 0 && Math.random() < 0.7) {
          scheduleNextConversation(8000 + Math.random() * 11000);
        } else {
          conversationTurns = 0;
          typing.textContent = "";
        }

      }, delay);
    }

    async function startConversation() {
      setBusy(true);

      await pauseBeforeReply();

      const firstPerson = chooseParticipant();
      const success = await getReply(firstPerson);

      setBusy(false);

      if (success) {
        conversationTurns = 2;
        scheduleNextConversation(8000 + Math.random() * 11000);
      } else {
        typing.textContent = "";
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || busy) return;

      clearTimers();
      typing.textContent = "";
      conversationTurns = 0;

      addMessage(message, true, "bezoeker");
      input.value = "";

      setBusy(true);

      await pauseBeforeReply();

      const firstPerson = chooseParticipant();
      const firstSuccess = await getReply(firstPerson);

      setBusy(false);

      if (firstSuccess) {
        conversationTurns = 2;
        scheduleNextConversation(8000 + Math.random() * 11000);
      } else {
        typing.textContent = "";
      }

      input.focus();
    });

    startConversation();
  </script>
</body>
</html>
