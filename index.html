<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100b18">
  <title>THE CONNECTION</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #100b18;
      color: #e9e3ed;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   sans-serif;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #15101d;
    }

    .header {
      height: 70px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #17111f;
      border-bottom: 1px solid #2b2335;
      flex-shrink: 0;
    }

    .title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #aaa1b5;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: #8d78a9;
      border-radius: 50%;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      max-width: 82%;
      animation: appear 0.2s ease-out;
    }

    .message.me {
      align-self: flex-end;
      align-items: flex-end;
    }

    .name {
      font-size: 11px;
      color: #a99bb8;
      margin: 0 0 6px 10px;
      letter-spacing: 0.3px;
    }

    .message.me .name {
      color: #b6a2ce;
      margin-right: 10px;
    }

    .bubble {
      padding: 11px 15px;
      border-radius: 18px;
      background: #272131;
      color: #eae4ef;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .message.me .bubble {
      background: #443354;
      color: #f4edf9;
      border-bottom-right-radius: 5px;
    }

    .message:not(.me) .bubble {
      border-bottom-left-radius: 5px;
    }

    .typing {
      min-height: 24px;
      padding: 0 24px 12px;
      font-size: 12px;
      color: #93889f;
      flex-shrink: 0;
    }

    .typing-dots {
      display: inline-flex;
      gap: 3px;
      margin-left: 5px;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;
      background: #9c8bb2;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    .footer {
      padding: 14px 16px 18px;
      background: #17111f;
      border-top: 1px solid #2b2335;
      flex-shrink: 0;
    }

    .form {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #241d2e;
      border: 1px solid #342a40;
      border-radius: 24px;
      padding: 5px 6px 5px 16px;
    }

    .input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #eee7f4;
      font-family: inherit;
      font-size: 14px;
      padding: 10px 0;
    }

    .input::placeholder {
      color: #81768c;
    }

    .send {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 50%;
      background: #67517f;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      transition: background 0.2s, opacity 0.2s;
      flex-shrink: 0;
    }

    .send:hover {
      background: #80669b;
    }

    .send:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .ending {
      text-align: center;
      color: #aaa0b7;
      font-size: 12px;
      padding: 5px 0 0;
      line-height: 1.5;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 60%, 100% {
        opacity: 0.25;
        transform: translateY(0);
      }
      30% {
        opacity: 1;
        transform: translateY(-2px);
      }
    }

    @media (max-width: 600px) {
      .app {
        max-width: 100%;
      }

      .header {
        height: 60px;
        padding: 0 17px;
      }

      .chat {
        padding: 20px 13px;
      }

      .message {
        max-width: 88%;
      }

      .bubble {
        font-size: 14px;
      }

      .footer {
        padding: 10px 12px 14px;
      }
    }

    /* Eindscherm The Connection */
    .ending-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      background: radial-gradient(ellipse at center, #20162e 0%, #100b18 70%);
      color: #e9e3ed;
      animation: endingAppear 1.2s ease forwards;
    }

    .ending-title {
      position: absolute;
      top: 35px;
      font-size: 13px;
      letter-spacing: 4px;
      font-weight: 600;
      color: #b7a5c9;
    }

    .ending-content {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .ending-line {
      height: 1px;
      width: 45px;
      background: #756184;
      margin: 30px auto;
      opacity: 0.7;
    }

    .ending-message {
      font-size: 22px;
      font-weight: 400;
      line-height: 1.5;
      color: #eee6f3;
    }

    .ending-submessage {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.8;
      color: #a99db5;
    }

    @keyframes endingAppear {
      from { opacity: 0; }
      to { opacity: 1; }
    }

  </style>
</head>

<body>
  <div class="app">

    <header class="header">
      <div class="title">THE CONNECTION</div>
      <div class="status">
        <span class="status-dot"></span>
        <span id="statusText">verbonden</span>
      </div>
    </header>

    <main class="chat" id="chat"></main>

    <div class="typing" id="typing"></div>

    <footer class="footer">
      <form class="form" id="messageForm">
        <input
          class="input"
          id="messageInput"
          type="text"
          placeholder="Bericht..."
          autocomplete="off"
          maxlength="500"
        >
        <button class="send" id="sendButton" type="submit" aria-label="Versturen">
          ↑
        </button>
      </form>
    </footer>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const chat = document.getElementById("chat");
      const form = document.getElementById("messageForm");
      const input = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const typing = document.getElementById("typing");
      const statusText = document.getElementById("statusText");

      const participants = ["A", "B", "C", "D"];
      const CHAT_DURATION = 4 * 60 * 1000;

      let history = [];
      let busy = false;
      let lastSpeaker = "";
      let chatEnded = false;
      let conversationStartedAt = Date.now();

      function addMessage(text, isMe = false, speaker = "bezoeker") {
        const message = document.createElement("div");
        message.className = isMe ? "message me" : "message";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = isMe ? "Jij" : "Persoon";

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        message.appendChild(name);
        message.appendChild(bubble);
        chat.appendChild(message);

        chat.scrollTop = chat.scrollHeight;

        history.push({ text, speaker });

        if (history.length > 50) {
          history = history.slice(-50);
        }
      }

      function showTyping() {
        typing.innerHTML =
          'Een Persoon typt <span class="typing-dots"><span></span><span></span><span></span></span>';
      }

      function wait(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function setBusy(value) {
        busy = value;
        sendButton.disabled = value || chatEnded;
      }

      function chooseParticipant() {
        let possible = participants.filter(person => person !== lastSpeaker);

        if (possible.length === 0) {
          possible = [...participants];
        }

        // D krijgt iets vaker de kans om te reageren
        const choices = [...possible, "D"];

        return choices[Math.floor(Math.random() * choices.length)];
      }

      async function getReply(character) {
        showTyping();

        const minimumTypingTime = 5000; // minimaal 5 seconden zichtbaar
        const typingStarted = Date.now();

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 35000);

        try {
          const response = await fetch("/chat", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            signal: controller.signal,
            body: JSON.stringify({
              character,
              history
            })
          });

          if (!response.ok) {
            const errorData = await response.json().catch(() => ({}));
            throw new Error(errorData.error || "De AI kon niet antwoorden.");
          }

          const data = await response.json();
          const reply = (data.reply || "").trim();

          if (!reply) {
            throw new Error("De AI gaf een leeg antwoord.");
          }

          // Zorg dat de typanimatie minimaal 5 seconden duurt
          const elapsed = Date.now() - typingStarted;
          if (elapsed < minimumTypingTime) {
            await wait(minimumTypingTime - elapsed);
          }

          addMessage(reply, false, character);
          lastSpeaker = character;
          typing.textContent = "";

          return true;

        } catch (error) {
          console.error("Chatfout:", error);

          if (error.name === "AbortError") {
            console.warn("AI-aanvraag afgebroken wegens timeout.");
          }

          typing.textContent = "";
          return false;

        } finally {
          clearTimeout(timeout);
        }
      }

      function endConversation() {
        chatEnded = true;

        document.body.innerHTML = `
          <div class="ending-screen">
            <div class="ending-title">THE CONNECTION</div>

            <div class="ending-content">
              <div class="ending-line"></div>

              <p class="ending-message">
                Het gesprek is afgelopen.
              </p>

              <p class="ending-submessage">
                Iedereen mag de cirkel verlaten via het uitgangsbordje.
              </p>

              <div class="ending-line"></div>
            </div>
          </div>
        `;

        document.body.style.margin = "0";
        document.body.style.background = "#100b18";
      }

      async function conversationLoop() {
        while (!chatEnded) {
          if (Date.now() - conversationStartedAt >= CHAT_DURATION) {
            endConversation();
            break;
          }

          // Pauze tussen berichten: 8 tot 19 seconden
          await wait(8000 + Math.random() * 11000);

          if (chatEnded) break;

          if (Date.now() - conversationStartedAt >= CHAT_DURATION) {
            endConversation();
            break;
          }

          setBusy(true);

          const nextPerson = chooseParticipant();
          const success = await getReply(nextPerson);

          setBusy(false);

          if (chatEnded) break;

          if (!success) {
            typing.textContent = "";
            console.warn("Automatisch opnieuw proberen...");
            await wait(7000 + Math.random() * 5000);
          }
        }
      }

      // Bezoeker kan berichten sturen
      form.addEventListener("submit", event => {
        event.preventDefault();

        const message = input.value.trim();

        if (!message || busy || chatEnded) return;

        addMessage(message, true, "bezoeker");
        input.value = "";
        input.focus();
      });

      // Automatisch starten
      conversationLoop();
    });
  </script>
</body>
</html>
