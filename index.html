
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>De installatie</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101820;
      color: #eeeeee;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 22px 18px;
      text-align: center;
      background: #172631;
      border-bottom: 1px solid #304653;
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 20px;
      font-weight: 500;
    }

    header p {
      margin: 0;
      color: #a9bdc8;
      font-size: 13px;
    }

    #chat {
      max-width: 750px;
      height: calc(100vh - 150px);
      margin: 0 auto;
      padding: 22px 16px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 15px;
      max-width: 85%;
    }

    .message .name {
      margin-bottom: 5px;
      color: #91b9d0;
      font-size: 12px;
    }

    .message .bubble {
      padding: 10px 14px;
      border-radius: 14px;
      background: #243743;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .message.me {
      margin-left: auto;
    }

    .message.me .name {
      text-align: right;
      color: #b5c6d0;
    }

    .message.me .bubble {
      background: #31536a;
    }

    #typing {
      max-width: 750px;
      margin: -4px auto 10px;
      padding: 0 18px;
      color: #91a7b3;
      font-size: 12px;
      min-height: 16px;
    }

    form {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 9px;
      padding: 14px;
      background: #172631;
      border-top: 1px solid #304653;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 13px 15px;
      border: 1px solid #405966;
      border-radius: 24px;
      outline: none;
      background: #243743;
      color: white;
      font-size: 16px;
    }

    input::placeholder { color: #9aadb8; }

    button {
      padding: 0 21px;
      border: none;
      border-radius: 24px;
      background: #477c9b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>
  <header>
    <h1>De installatie</h1>
    <p>Een kleine kunstfestival-installatie, omringd door blauwe lakens</p>
  </header>

  <main id="chat"></main>
  <div id="typing"></div>

  <form id="messageForm">
    <input
      id="messageInput"
      type="text"
      placeholder="Typ een bericht..."
      autocomplete="off"
      required
    >
    <button id="sendButton" type="submit">Stuur</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");

    const participants = ["A", "B", "C"];

    let history = [];
    let busy = false;
    let idleTimer = null;
    let autoRemaining = 3;
    let lastSpeaker = "";

    function addMessage(text, isMe = false, speaker = "bezoeker") {
      const message = document.createElement("div");
      message.className = isMe ? "message me" : "message";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = "Persoon";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(name);
      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;

      history.push({ text, speaker });

      if (history.length > 50) {
        history = history.slice(-50);
      }
    }

    async function getReply(character) {
      typing.textContent = "Een Persoon typt...";

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            character,
            history
          })
        });

        if (!response.ok) {
          throw new Error("Er ging iets mis met het antwoord.");
        }

        const data = await response.json();
        const reply = (data.reply || "").trim();

        if (reply) {
          addMessage(reply, false, character);
          lastSpeaker = character;
          return true;
        }
      } catch (error) {
        console.error(error);
      }

      return false;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startConversation() {
      busy = true;

      await getReply("A");
      await wait(900);

      await getReply("B");
      await wait(900);

      await getReply("C");

      busy = false;
      typing.textContent = "";
      scheduleIdle();
    }

    function scheduleIdle() {
      clearTimeout(idleTimer);

      if (autoRemaining <= 0) return;

      idleTimer = setTimeout(async () => {
        if (busy) {
          scheduleIdle();
          return;
        }

        busy = true;
        autoRemaining--;

        const possible = participants.filter(p => p !== lastSpeaker);
        const next = possible[Math.floor(Math.random() * possible.length)];

        await getReply(next);

        busy = false;
        typing.textContent = "";
        scheduleIdle();
      }, 6000 + Math.random() * 5000);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || busy) return;

      clearTimeout(idleTimer);

      addMessage(message, true, "bezoeker");
      input.value = "";

      busy = true;
      sendButton.disabled = true;
      autoRemaining = 3;

      const order = participants.filter(p => p !== lastSpeaker);

      for (const character of order) {
        await wait(800 + Math.random() * 700);
        await getReply(character);
      }

      busy = false;
      sendButton.disabled = false;
      typing.textContent = "";
      scheduleIdle();
      input.focus();
    });

    startConversation();
  </script>
</body>
</html>
