
<script>
document.addEventListener("DOMContentLoaded", () => {
  // Elementen automatisch zoeken
  const chat = document.getElementById("chat") || document.querySelector(".chat");
  const input =
    document.getElementById("messageInput") ||
    document.querySelector('input[type="text"]') ||
    document.querySelector("textarea");

  const sendButton =
    document.getElementById("sendButton") ||
    document.querySelector('button[type="submit"]');

  const form =
    document.getElementById("messageForm") ||
    (input ? input.closest("form") : null) ||
    document.querySelector("form");

  const typing = document.getElementById("typing");

  console.log("The Connection elementen:", {
    chat,
    input,
    sendButton,
    form,
    typing
  });

  const participants = ["A", "B", "C", "D"];
  const CHAT_DURATION = 4 * 60 * 1000;

  let history = [];
  let busy = false;
  let lastSpeaker = "";
  let chatEnded = false;
  let conversationStartedAt = Date.now();

  function addMessage(text, isMe = false, speaker = "bezoeker") {
    if (!chat) {
      console.error("Chatvenster ontbreekt.");
      return;
    }

    const message = document.createElement("div");
    message.className = isMe ? "message me" : "message";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "Persoon";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(name);
    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    history.push({ text, speaker });

    if (history.length > 50) {
      history = history.slice(-50);
    }
  }

  function showTyping() {
    if (!typing) return;

    typing.innerHTML =
      'Een Persoon typt <span class="typing-dots"><span></span><span></span><span></span></span>';
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function setBusy(value) {
    busy = value;

    if (sendButton) {
      sendButton.disabled = value || chatEnded;
    }
  }

  function chooseParticipant() {
    let possible = participants.filter(person => person !== lastSpeaker);

    if (possible.length === 0) {
      possible = [...participants];
    }

    const choices = [...possible, "D"];

    return choices[Math.floor(Math.random() * choices.length)];
  }

  async function getReply(character) {
    showTyping();

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 35000);

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        signal: controller.signal,
        body: JSON.stringify({
          character,
          history
        })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || "De AI kon niet antwoorden.");
      }

      const data = await response.json();
      const reply = (data.reply || "").trim();

      if (!reply) {
        throw new Error("De AI gaf een leeg antwoord.");
      }

      addMessage(reply, false, character);
      lastSpeaker = character;

      if (typing) typing.textContent = "";

      return true;
    } catch (error) {
      console.error("Chatfout:", error);

      if (error.name === "AbortError") {
        console.warn("AI-aanvraag afgebroken wegens timeout.");
      }

      if (typing) typing.textContent = "";

      return false;
    } finally {
      clearTimeout(timeout);
    }
  }

  function endConversation() {
    chatEnded = true;
    setBusy(false);

    if (input) input.disabled = true;
    if (sendButton) sendButton.disabled = true;

    if (typing) {
      typing.textContent =
        "Het gesprek is afgelopen. Iedereen mag de cirkel verlaten via het uitgangsbordje.";
    }
  }

  async function conversationLoop() {
    while (!chatEnded) {
      if (Date.now() - conversationStartedAt >= CHAT_DURATION) {
        endConversation();
        break;
      }

      await wait(8000 + Math.random() * 11000);

      if (chatEnded) break;

      if (Date.now() - conversationStartedAt >= CHAT_DURATION) {
        endConversation();
        break;
      }

      setBusy(true);

      const nextPerson = chooseParticipant();
      const success = await getReply(nextPerson);

      setBusy(false);

      if (chatEnded) break;

      if (!success) {
        if (typing) typing.textContent = "";
        console.warn("Opnieuw proberen...");
        await wait(7000 + Math.random() * 5000);
      }
    }
  }

  // Bericht van bezoeker versturen
  function sendVisitorMessage(event) {
    if (event) event.preventDefault();

    if (!input) {
      console.error("Invoerveld ontbreekt.");
      return;
    }

    const message = input.value.trim();

    if (!message || busy || chatEnded) return;

    addMessage(message, true, "bezoeker");
    input.value = "";
    input.focus();
  }

  // Formulier koppelen indien aanwezig
  if (form) {
    form.addEventListener("submit", sendVisitorMessage);
  } else if (sendButton) {
    // Alternatief als er geen formulier bestaat
    sendButton.addEventListener("click", sendVisitorMessage);
  }

  // Enter verstuurt bericht bij een los invoerveld
  if (input && !form) {
    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && input.tagName !== "TEXTAREA") {
        sendVisitorMessage(event);
      }
    });
  }

  // Start automatische AI-conversatie
  conversationLoop();
});
</script>
