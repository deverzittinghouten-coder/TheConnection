
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101c1a">
  <title>THE CONNECTION</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101c1a;
      color: #e5ece8;
      font-family: "DM Sans", sans-serif;
    }

    .app {
      max-width: 850px;
      height: 100dvh;
      margin: auto;
      display: flex;
      flex-direction: column;
      padding: 0 24px;
      background: #142321;
    }

    header {
      padding: 27px 0 23px;
      border-bottom: 1px solid rgba(190, 213, 201, 0.09);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background: #24433a;
      color: #b4d5c1;
      font-size: 19px;
    }

    h1 {
      margin: 0;
      font-family: "Manrope", sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 2.4px;
    }

    .subtitle {
      margin-top: 5px;
      color: #82958d;
      font-size: 10px;
      letter-spacing: 1.6px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #91a69a;
      font-size: 10px;
      letter-spacing: 1.2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: #82b69a;
      border-radius: 50%;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 32px 3px;
      scrollbar-width: thin;
      scrollbar-color: #355047 transparent;
    }

    .date-label {
      text-align: center;
      color: #71867c;
      font-size: 10px;
      letter-spacing: 2px;
      margin: 5px 0 35px;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 23px;
      max-width: 78%;
      animation: appear 0.3s ease;
    }

    .message.me {
      align-items: flex-end;
      margin-left: auto;
    }

    .name {
      color: #9cbea9;
      font-size: 10px;
      font-weight: 600;
      margin: 0 0 7px 5px;
      letter-spacing: 0.5px;
    }

    .message.me .name {
      color: #9aafa3;
      margin-right: 5px;
    }

    .bubble {
      padding: 13px 17px;
      background: #20332f;
      border: 1px solid rgba(180, 210, 190, 0.06);
      border-radius: 4px 16px 16px 16px;
      color: #e0e9e3;
      line-height: 1.65;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .message.me .bubble {
      background: #294b40;
      border-color: rgba(170, 210, 180, 0.08);
      border-radius: 16px 4px 16px 16px;
      color: #eff6f0;
    }

    #typing {
      min-height: 27px;
      color: #91a99a;
      font-size: 11px;
      letter-spacing: 0.3px;
      padding: 0 5px;
    }

    .typing-dots {
      display: inline-flex;
      gap: 4px;
      margin-left: 7px;
    }

    .typing-dots span {
      width: 4px;
      height: 4px;
      background: #9ac4a8;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    .composer {
      padding: 17px 0 23px;
      border-top: 1px solid rgba(190, 213, 201, 0.09);
    }

    form {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 7px 6px 18px;
      background: #1b2c28;
      border: 1px solid #344a41;
      border-radius: 15px;
      transition: border 0.2s;
    }

    form:focus-within {
      border-color: #729b80;
    }

    input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: #edf4ee;
      font: inherit;
      font-size: 14px;
      padding: 11px 0;
    }

    input::placeholder {
      color: #7e9186;
    }

    button {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 11px;
      background: #416b56;
      color: #f0f6f0;
      font-size: 19px;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover {
      background: #527d65;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
      transform: none;
    }

    .footer-note {
      text-align: center;
      margin-top: 13px;
      color: #687e73;
      font-size: 9px;
      letter-spacing: 1.1px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      from {
        opacity: 0.3;
        transform: translateY(0);
      }
      to {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    @media (max-width: 600px) {
      .app {
        padding: 0 16px;
      }

      header {
        padding: 21px 0 18px;
      }

      h1 {
        font-size: 15px;
      }

      .message {
        max-width: 90%;
      }

      #chat {
        padding-top: 25px;
      }

      .status {
        font-size: 9px;
      }
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark">✳</div>
        <div>
          <h1>THE CONNECTION</h1>
          <div class="subtitle">A SPACE TO CONNECT</div>
        </div>
      </div>

      <div class="status">
        <span class="status-dot"></span>
        LIVE CHAT
      </div>
    </header>

    <main id="chat">
      <div class="date-label">THE CONVERSATION</div>
    </main>

    <div id="typing"></div>

    <div class="composer">
      <form id="messageForm">
        <input
          id="messageInput"
          type="text"
          placeholder="Schrijf iets..."
          autocomplete="off"
          required
        >
        <button id="sendButton" type="submit" aria-label="Verstuur">↑</button>
      </form>
      <div class="footer-note">EVERY CONVERSATION STARTS SOMEWHERE</div>
    </div>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("messageForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");

    const participants = ["A", "B", "C", "D"];

    let history = [];
    let busy = false;
    let idleTimer = null;
    let typingTimer = null;
    let lastSpeaker = "";
    let conversationTurns = 0;

    function addMessage(text, isMe = false, speaker = "bezoeker") {
      const message = document.createElement("div");
      message.className = isMe ? "message me" : "message";

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = "Persoon";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      message.appendChild(name);
      message.appendChild(bubble);
      chat.appendChild(message);

      chat.scrollTop = chat.scrollHeight;
      history.push({ text, speaker });

      if (history.length > 50) {
        history = history.slice(-50);
      }
    }

    function showTyping() {
      typing.innerHTML =
        'Een Persoon typt <span class="typing-dots"><span></span><span></span><span></span></span>';
    }

    function clearTimers() {
      clearTimeout(idleTimer);
      clearTimeout(typingTimer);
      idleTimer = null;
      typingTimer = null;
    }

    function wait(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setBusy(value) {
      busy = value;
      sendButton.disabled = value;
    }

    function chooseParticipant() {
      const possible = participants.filter(person => person !== lastSpeaker);

      if (possible.length === 0) return "D";

      const choices = [...possible, "D", "D"];

      return choices[Math.floor(Math.random() * choices.length)];
    }

    async function pauseBeforeReply() {
      await wait(1500 + Math.random() * 2500);
      showTyping();
      await wait(3000 + Math.random() * 3000);
    }

    async function getReply(character) {
      showTyping();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            character,
            history
          })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || "De AI kon niet antwoorden.");
        }

        const data = await response.json();
        const reply = (data.reply || "").trim();

        if (!reply) {
          throw new Error("De AI gaf een leeg antwoord.");
        }

        addMessage(reply, false, character);
        lastSpeaker = character;
        typing.textContent = "";

        return true;

      } catch (error) {
        console.error("Chatfout:", error);
        typing.textContent = "Er ging iets mis met de verbinding.";
        return false;
      }
    }

    function scheduleNextConversation(delay) {
      clearTimers();

      if (conversationTurns <= 0) {
        typing.textContent = "";
        return;
      }

      const typingDelay = Math.max(
        1000,
        delay - (4000 + Math.random() * 4000)
      );

      typingTimer = setTimeout(() => {
        if (!busy) showTyping();
      }, typingDelay);

      idleTimer = setTimeout(async () => {
        if (busy) {
          scheduleNextConversation(5000 + Math.random() * 5000);
          return;
        }

        setBusy(true);

        const nextPerson = chooseParticipant();
        const success = await getReply(nextPerson);

        setBusy(false);

        if (!success) {
          typing.textContent = "";
          return;
        }

        conversationTurns--;

        if (conversationTurns > 0 && Math.random() < 0.7) {
          scheduleNextConversation(8000 + Math.random() * 11000);
        } else {
          conversationTurns = 0;
          typing.textContent = "";
        }

      }, delay);
    }

    async function startConversation() {
      setBusy(true);

      await pauseBeforeReply();

      const firstPerson = chooseParticipant();
      const success = await getReply(firstPerson);

      setBusy(false);

      if (success) {
        conversationTurns = 2;
        scheduleNextConversation(8000 + Math.random() * 11000);
      } else {
        typing.textContent = "";
      }
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();

      const message = input.value.trim();

      if (!message || busy) return;

      clearTimers();
      typing.textContent = "";
      conversationTurns = 0;

      addMessage(message, true, "bezoeker");
      input.value = "";

      setBusy(true);

      await pauseBeforeReply();

      const firstPerson = chooseParticipant();
      const firstSuccess = await getReply(firstPerson);

      setBusy(false);

      if (firstSuccess) {
        conversationTurns = 2;
        scheduleNextConversation(8000 + Math.random() * 11000);
      } else {
        typing.textContent = "";
      }

      input.focus();
    });

    startConversation();
  </script>
</body>
</html>
