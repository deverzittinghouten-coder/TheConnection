
<script>
  const chat = document.getElementById("chat");
  const form = document.getElementById("messageForm");
  const input = document.getElementById("messageInput");
  const sendButton = document.getElementById("sendButton");
  const typing = document.getElementById("typing");

  const participants = ["A", "B", "C", "D"];

  const CHAT_DURATION = 4 * 60 * 1000;

  let history = [];
  let busy = false;
  let lastSpeaker = "";
  let chatEnded = false;
  let conversationStartedAt = Date.now();

  function addMessage(text, isMe = false, speaker = "bezoeker") {
    const message = document.createElement("div");
    message.className = isMe ? "message me" : "message";

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = "Persoon";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(name);
    message.appendChild(bubble);
    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    history.push({ text, speaker });

    if (history.length > 50) {
      history = history.slice(-50);
    }
  }

  function showTyping() {
    typing.innerHTML =
      'Een Persoon typt <span class="typing-dots"><span></span><span></span><span></span></span>';
  }

  function wait(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function setBusy(value) {
    busy = value;
    sendButton.disabled = value || chatEnded;
  }

  function chooseParticipant() {
    let possible = participants.filter(person => person !== lastSpeaker);

    if (possible.length === 0) {
      possible = [...participants];
    }

    // D krijgt iets vaker de kans om te reageren
    const choices = [...possible, "D"];

    return choices[Math.floor(Math.random() * choices.length)];
  }

  async function getReply(character) {
    showTyping();

    // Timeout aan de frontend-kant als een verzoek onverwacht blijft hangen
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 35000);

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        signal: controller.signal,
        body: JSON.stringify({
          character,
          history
        })
      });

      if (!response.ok) {
        const errorData = await response.json().catch(() => ({}));
        throw new Error(errorData.error || "De AI kon niet antwoorden.");
      }

      const data = await response.json();
      const reply = (data.reply || "").trim();

      if (!reply) {
        throw new Error("De AI gaf een leeg antwoord.");
      }

      addMessage(reply, false, character);
      lastSpeaker = character;
      typing.textContent = "";

      return true;

    } catch (error) {
      console.error("Chatfout:", error);

      if (error.name === "AbortError") {
        console.warn("AI-aanvraag afgebroken wegens timeout.");
      }

      return false;

    } finally {
      clearTimeout(timeout);
    }
  }

  function endConversation() {
    chatEnded = true;
    setBusy(false);
    input.disabled = true;
    sendButton.disabled = true;
    typing.textContent =
      "Het gesprek is afgelopen. Iedereen mag de cirkel verlaten via het uitgangsbordje.";
  }

  // ÉÉN CENTRALE AUTOMATISCHE GESPREKSLOOP
  async function conversationLoop() {
    while (!chatEnded) {
      const elapsed = Date.now() - conversationStartedAt;

      if (elapsed >= CHAT_DURATION) {
        endConversation();
        break;
      }

      // Rustige pauze tussen berichten
      await wait(8000 + Math.random() * 11000);

      if (chatEnded) break;

      if (Date.now() - conversationStartedAt >= CHAT_DURATION) {
        endConversation();
        break;
      }

      setBusy(true);

      const nextPerson = chooseParticipant();
      const success = await getReply(nextPerson);

      setBusy(false);

      if (chatEnded) break;

      if (success) {
        // Na succes blijft de loop vanzelf doorgaan
        continue;
      }

      // Bij fouten stopt de loop niet: automatisch opnieuw proberen
      typing.textContent = "";
      console.warn("Automatisch opnieuw proberen...");
      await wait(7000 + Math.random() * 5000);
    }
  }

  // Bezoeker kan berichten sturen
  form.addEventListener("submit", async event => {
    event.preventDefault();

    const message = input.value.trim();

    if (!message || busy || chatEnded) return;

    addMessage(message, true, "bezoeker");
    input.value = "";

    input.focus();
  });

  // Start de chat precies één keer
  conversationLoop();
</script>
